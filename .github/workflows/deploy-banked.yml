name: Deploy Chatie Banked

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出GitHub仓库代码
        uses: actions/checkout@v4
        
      - name: 上传后端文件到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "app.py,requirements.txt"
          target: "/var/www/banked/chatie_banked"
          
      - name: service deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/banked/chatie_banked
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart chatie_banked

  sync-server-to-github:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          
      - name: download files from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 创建临时目录并复制文件到可访问位置
            mkdir -p /tmp/github_sync
            cp /var/www/banked/chatie_banked/app.py /tmp/github_sync/app.py
            cp /var/www/banked/chatie_banked/requirements.txt /tmp/github_sync/requirements.txt
            
            # 设置文件权限
            chmod 644 /tmp/github_sync/*
            
      - name: copy files from server  
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "/tmp/github_sync/app.py,/tmp/github_sync/requirements.txt"
          target: "./"
          strip_components: 2
          
      - name: commit and push changes
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync server changes $(date +%Y%m%d-%H%M%S)"
            git push origin main
          else
            echo "No changes to sync"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}