name: Deploy Chatie Banked  

on:
  push:
    branches: [ main ]
  workflow_dispatch:  
  schedule:
    - cron: '0 3 * * *'  


jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出GitHub仓库代码
        uses: actions/checkout@v4  

      - name: 上传后端文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}  
          source: "app.py,requirements.txt"  
          target: "/var/www/banked/chatie_banked"  

      - name: service deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/banked/chatie_banked
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart chatie_banked


  sync-server-to-github:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: commit service code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}  

      - name: download code
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          direction: download 
          source: "/var/www/banked/chatie_banked/app.py,/var/www/banked/chatie_banked/requirements.txt"  # 服务器目标文件
          target: "./" 

      - name: update
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync server changes $(date +%Y%m%d)"
            git push origin main  
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}  