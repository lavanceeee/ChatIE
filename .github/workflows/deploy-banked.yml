name: Deploy Chatie Banked

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to perform'
        required: true
        default: 'sync-to-github'
        type: choice
        options:
          - sync-to-github
          - deploy-to-server
  schedule:
    - cron: '0 3 * * *'

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy-to-server')
    steps:
      - name: 检出GitHub仓库代码
        uses: actions/checkout@v4
        
      - name: 上传后端文件到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "app.py,requirements.txt"
          target: "/var/www/banked/chatie_banked"
          
      - name: service deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/banked/chatie_banked
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart chatie_banked

  sync-server-to-github:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'sync-to-github' || github.event.inputs.action == ''))
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          
      - name: download files from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 创建临时目录并复制文件到可访问位置
            mkdir -p /tmp/github_sync
            cp /var/www/banked/chatie_banked/app.py /tmp/github_sync/app.py
            cp /var/www/banked/chatie_banked/requirements.txt /tmp/github_sync/requirements.txt
            
            # 设置文件权限
            chmod 644 /tmp/github_sync/*
            
      - name: copy files from server  
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 输出文件内容到GitHub Actions日志
            echo "--- app.py content ---"
            cat /tmp/github_sync/app.py
            echo "--- requirements.txt content ---"  
            cat /tmp/github_sync/requirements.txt
            echo "--- download complete ---"

      - name: download and save files
        run: |
          # 创建临时SSH密钥文件
          echo "${{ secrets.VPS_SSH_KEY }}" > ssh_key
          chmod 600 ssh_key
          
          # 下载文件
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT || 22 }} -i ssh_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cat /tmp/github_sync/app.py' > app.py
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT || 22 }} -i ssh_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cat /tmp/github_sync/requirements.txt' > requirements.txt
          
          # 清理临时密钥文件
          rm -f ssh_key
          
          # 验证文件
          echo "Downloaded files:"
          ls -la app.py requirements.txt
          
      - name: commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync server changes $(date +%Y%m%d-%H%M%S)"
            git push origin main
          else
            echo "No changes to sync"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}